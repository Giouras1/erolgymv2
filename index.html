<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A focused home workout index with guided sets, rest timers, exercise demonstrations, and dumbbell setup diagrams."
    />
    <meta name="theme-color" content="#11120f" />
    <title>Erol's Gym | Home workout tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to workout content</a>

    <header class="site-header">
      <a class="brand" href="./" data-home-link aria-label="Erol's Gym, workout index">
        <span class="brand-mark" aria-hidden="true">EG</span>
        <span class="brand-name">EROL'S GYM</span>
      </a>
      <div class="header-status" aria-label="Training status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="headerStatus">READY TO TRAIN</span>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <aside class="music-dock is-collapsed" id="musicDock" aria-label="Background music player">
      <header class="music-dock-header">
        <div class="music-dock-title">
          <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>TRAINING AUDIO</strong><small id="musicProvider">SPOTIFY</small></span>
        </div>
        <button class="music-toggle" type="button" data-music-toggle aria-expanded="false" aria-controls="musicDockBody" aria-label="Open music player">+</button>
      </header>
      <div class="music-dock-body" id="musicDockBody">
        <iframe
          id="musicFrame"
          title="Spotify training playlist"
          src="https://open.spotify.com/embed/playlist/37i9dQZF1DX76Wlfdnj7AP?utm_source=generator&theme=0"
          width="100%"
          height="352"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
        ></iframe>
        <form class="music-form" id="musicForm">
          <label for="musicUrl">Load your mix</label>
          <div class="music-input-row">
            <input id="musicUrl" name="musicUrl" type="url" inputmode="url" placeholder="Spotify, YouTube Music, or SoundCloud link" autocomplete="off" required />
            <button type="submit">Load</button>
          </div>
          <p class="music-message" id="musicMessage">Paste a playlist, album, or track link.</p>
        </form>
      </div>
    </aside>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript-message">This workout tracker needs JavaScript enabled to run guided sessions.</div>
    </noscript>
  </body>
</html>
